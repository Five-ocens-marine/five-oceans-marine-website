<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request a Marine Service | Five Oceans Marine</title>

<link rel="stylesheet" href="CSS/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

.hero{
    position:relative;
    height:55vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    text-align:center;
    padding-top:90px;
}

.hero-video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    top:0;
    left:0;
    z-index:-2;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:rgba(7,25,46,.65);
    z-index:-1;
}

.hero-content{
    color:white;
    max-width:800px;
    padding:20px;
}

.form-section{
    background:white;
    padding:80px 10%;
}

.form-container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:50px;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
}

.form-container h2{
    margin-bottom:35px;
    color:#07192E;
    font-size:38px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    margin-bottom:8px;
    font-weight:600;
    color:#07192E;
}

input,
select,
textarea{
    padding:15px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:16px;
    font-family:inherit;
}

textarea{
    min-height:180px;
    resize:vertical;
}

.submit-btn{
    margin-top:35px;
    width:100%;
    padding:18px;
    background:#0A66C2;
    color:white;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    background:#084C91;
}

@media(max-width:800px){

.form-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<nav>

<div class="logo">
    <a href="index.html">
        <img src="images/logo.png" alt="Five Oceans Marine">
    </a>
</div>

<ul class="nav-links">

    <li>
        <a href="index.html">Home</a>
    </li>

    <li>
        <a href="index.html#about">About</a>
    </li>

    <li>
        <a href="index.html#services">Services</a>
    </li>

    <li>
        <a href="index.html#contact">Contact</a>
    </li>

    <li>
        <a href="form.html" class="nav-button">
            Request Service
        </a>
    </li>

</ul>

<div class="mobile-menu-btn">

    <span></span>
    <span></span>
    <span></span>

</div>

</nav>

<section class="hero">

<video autoplay muted loop playsinline class="hero-video">
<source src="images/marine-video.mp4" type="video/mp4">
</video>

<div class="hero-overlay"></div>

<div class="hero-content">

<h1>Request a Marine Service</h1>

<p>
Complete the form below and our team will contact you shortly.
</p>

</div>

</section>

<section class="form-section">

<div class="form-container">

<h2>Service Request Form</h2>

<form action="https://formsubmit.co/info@fiveocensmarine.co.nz" method="POST">

<input type="hidden" name="_subject" value="New Marine Service Request">

<input type="hidden" name="_captcha" value="false">

<div class="form-grid">

<div class="form-group">
<label>Full Name *</label>
<input type="text" name="Full Name" required>
</div>

<div class="form-group">

<label>
Service Required *
</label>

<select id="serviceSelect" name="Service" required>

<option value="">Select Service</option>

<option value="surveys">
Marine Surveys
</option>

<option value="cranes">
Crane Inspections
</option>

<option value="bulk">
Break Bulk
</option>

<option value="investigations">
Marine Investigations
</option>

<option value="compliance">
Compliance
</option>

<option value="inspectiontypes">
Inspection Types
</option>

</select>

</div>


<div class="form-group" id="subServiceBox" style="display:none;">

<label>
Specific Service *
</label>

<select id="subServiceSelect" name="Specific Service" required>

</select>

</div>
<div class="form-group">
<label>Port</label>
<input type="text" name="Port">
</div>

<div class="form-group">
<label>Vessel Name</label>
<input type="text" name="Vessel">
</div>

<div class="form-group">
<label>IMO Number</label>
<input type="text" name="IMO">
</div>


<div class="form-group">
<label>ETA / Operation Date</label>
<input type="date" name="Date">
</div>

<div class="form-group full">

<label>Describe Your Requirements</label>

<textarea name="Message" placeholder="Provide details about your cargo operation, loading/discharging schedule, special requirements, or any additional information..."></textarea>

</div>

</div>
<div class="form-group full legal-box">


<label>

<input type="checkbox" name="Agreement" required>

I confirm that the information provided in this request is accurate and complete. 
I understand that Five Oceans Marine provides independent marine inspection and consultancy services based on the information supplied by the client.

</label>


<label>

<input type="checkbox" name="Terms" required>

I acknowledge that this request does not constitute a contract, guarantee, certification, or acceptance of liability until a formal agreement or written confirmation is issued by Five Oceans Marine.

</label>


<label>

<input type="checkbox" name="Privacy" required>

I agree that my contact information may be used solely for the purpose of responding to this service request.

</label>


</div>
<button class="submit-btn" type="submit">

Submit Request

</button>

</form>

</div>

</section>
<script>

const services = {

surveys:[
"Cargo Supervising",
"Condition Surveys",
"Owners Representation",
"Marine Inspections"
],

cranes:[
"Ship Crane Inspections",
"Lifting Equipment"
],

bulk:[
"Loading Supervision",
"Heavy Lift",
"Lashing Verification"
],

investigations:[
"Damage Investigation",
"Root Cause Analysis",
"Technical Reporting"
],

compliance:[
"Marshall Islands",
"Safety Inspections",
"Compliance Support"
],

inspectiontypes:[
"Pre-Vetting Inspections",
"Navigation Assessment",
"Condition Inspection",
"Pre-Sale Inspection",
"Pre-Purchase Inspection"
]

};


const serviceSelect=document.getElementById("serviceSelect");

const subServiceBox=document.getElementById("subServiceBox");

const subServiceSelect=document.getElementById("subServiceSelect");


serviceSelect.addEventListener("change",function(){


subServiceSelect.innerHTML="";


if(this.value && services[this.value]){


subServiceBox.style.display="flex";


services[this.value].forEach(function(item){


let option=document.createElement("option");

option.value=item;

option.textContent=item;

subServiceSelect.appendChild(option);


});


}

else{


subServiceBox.style.display="none";


}


});


</script>

<script src="JS/script.js"></script>

</body>
</html>
